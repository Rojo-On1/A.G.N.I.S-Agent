name: Sync CWE catalog

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CWE_URL: https://cwe.mitre.org/data/xml/cwec_v5.0.xml
      UPDATE_BRANCH: automation/update-cwe-catalog
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download official CWE catalog
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 --silent --show-error \
            "$CWE_URL" --output data/cwec_v5.0.xml
          grep -q "<WeaknessCatalog" data/cwec_v5.0.xml

      - name: Create update branch
        id: changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add data/cwec_v5.0.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update CWE catalog"
          git push --force origin "$UPDATE_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update CWE catalog" \
              --body "Automated update from the official MITRE CWE XML catalog."
          else
            echo "Updated existing PR #$existing_pr"
          fi
